name: Test Devourer image policy
on:
  pull_request:
  push:
    paths:
      - additionalFiles/prepare-devourer-image.sh
      - additionalFiles/configure-rpi-splash.sh
      - additionalFiles/configure-rockchip-native.sh
      - additionalFiles/rockchip-mali-runtime.py
      - additionalFiles/rockchip-silent-boot.py
      - additionalFiles/openhd-splash/**
      - images/**
      - additionalFiles/install-current-components.sh
      - scripts/common.sh
      - scripts/sdk_builder.sh
      - X86-Installer.sh
      - additionalFiles/Buildroot/openhd/**
      - scripts/tests/test_devourer_image.sh
      - scripts/tests/test_release_components.py
      - scripts/tests/test_rockchip_native.py
      - .github/workflows/update-image.yml
      - stages/**
      - .github/workflows/test-devourer-image.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check shell syntax
        run: |
          bash -n additionalFiles/prepare-devourer-image.sh
          bash -n additionalFiles/configure-rpi-splash.sh
          bash -n additionalFiles/configure-rockchip-native.sh
          bash -n additionalFiles/install-current-components.sh
          bash -n scripts/common.sh
          bash -n scripts/sdk_builder.sh
          bash -n X86-Installer.sh
          bash -n stages/02-Packages/00-run-chroot.sh
          bash -n stages/03-Preconfiguration/00-run-chroot.sh
          bash -n stages/03-Preconfiguration/01-run-chroot.sh
          bash -n stages/03-Preconfiguration/02-run-chroot.sh
          bash -n stages/Update/update.sh
      - name: Test release component selection
        run: python3 scripts/tests/test_release_components.py
      - name: Test full Rockchip native display and removed Lite targets
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          /usr/bin/python3 scripts/tests/test_rockchip_native.py
      - name: Test image cleanup
        run: bash scripts/tests/test_devourer_image.sh
