name: OpenHD Lite Image Workflow

on:
  push:
    branches:
      - dev-release
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  openhd-lite-image:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - TARGET: radxa-cubie-lite
          - TARGET: radxa-zero3w-lite
          - TARGET: radxa-cm5-lite
          - TARGET: orangepi-zero3w-lite
          - TARGET: rock5a-lite
          - TARGET: rock5b-lite

    steps:
      - name: Setup env
        run: |
          echo "DT=$(date -d '+1 hour' +'%m-%d-%Y-%H-%M-%S')" >> "$GITHUB_ENV"
          echo "BRANCH=${GITHUB_REF##*/}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Update apt metadata
        run: sudo apt-get update

      - name: Free runner disk space
        run: |
          sudo apt-get purge -y \
            '^llvm-.*' \
            'php.*' \
            '^mongodb-.*' \
            '^mysql-.*' \
            azure-cli \
            google-chrome-stable \
            firefox \
            powershell \
            microsoft-edge-stable \
            mono-devel
          sudo apt-get autoremove -y
          sudo apt-get clean

      - name: Install host dependencies
        run: sudo apt-get install -y unzip curl git qemu qemu-user-static binfmt-support rclone

      - name: Mark dev-release package source
        if: ${{ env.BRANCH == 'dev-release' || env.BRANCH == 'debug_next' }}
        run: |
          touch additionalFiles/dev-build

      - name: Update e2fsprogs
        run: |
          git clone https://github.com/tytso/e2fsprogs
          cd e2fsprogs
          mkdir build
          cd build
          ../configure
          make
          sudo make install

      - name: Install image builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          sudo ./install_dep.sh

      - name: Build OpenHD Lite image
        env:
          OPENHD_RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
        run: |
          sudo -E ./build.sh ${{ matrix.TARGET }} false false true

      - name: Normalize image name for artifact
        run: |
          set -euo pipefail
          count=$(ls -1 deploy/*.img 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No .img files found in deploy/"
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            echo "Multiple .img files found in deploy/:"
            ls -1 deploy/*.img
            exit 1
          fi
          img_path=$(ls -1 deploy/*.img)
          target_name="openhd-lite-image-${{ matrix.TARGET }}-${{ env.DT }}.img"
          sudo mv "$img_path" "deploy/$target_name"

      - name: Upload OpenHD Lite image artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhd-lite-image-${{ matrix.TARGET }}-${{ env.DT }}
          path: deploy/*.img
