name: New_Image_Workflow
run-name: OpenHD ${{ github.ref_name == 'snapshots' && format('0.0.{0}', github.run_number) || '3.0-albatros-beta4' }} (${{ inputs.target || 'all' }})

on:
  workflow_dispatch:
    inputs:
      target:
        description: Image set to build
        required: true
        type: choice
        default: all
        options:
          - all
          - supported
          - openhd-hardware
          - full
          - radxa-zero3w
          - ochin-v1
          - ochin-v2
          - experimental
          - x86
          - x21-update
          - orqa
          - luckfox
          - luckfox-pico-mini-nand
          - luckfox-pico-pro-max-nand
          - publish-pi
      source_run:
        description: Source image run for publish-pi, or OpenHD component run for orqa
        required: false
        type: string
  push:
    branches:
      - snapshots

concurrency:
  group: final-image-ci-${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  IMAGE_RELEASE: ${{ github.ref_name == 'snapshots' && format('0.0.{0}', github.run_number) || '3.0-albatros-beta4' }}
  OPENHD_SNAPSHOT_NUMBER: ${{ github.ref_name == 'snapshots' && github.run_number || '' }}
  X21_COMPONENT_BASE_URL: https://dl.cloudsmith.io/public/openhd/dev-release/raw/files

jobs:
  x86-openhd-os:
    name: Build OpenHD-OS on x86
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'x86'
    uses: OpenHD/OpenHD-OS/.github/workflows/build.yml@2ce0fc4c6db11cc0b7da3b01a7ff330ca96127ec
    with:
      openhd_ref: snapshots
      qopenhd_ref: snapshots
      sysutils_ref: snapshots

  luckfox-pico-images:
    name: Luckfox Pico application overlay images
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'luckfox' || inputs.target == 'luckfox-pico-mini-nand' || inputs.target == 'luckfox-pico-pro-max-nand'
    uses: ./.github/workflows/luckfox-images.yml
    with:
      target: ${{ startsWith(inputs.target, 'luckfox-pico-') && inputs.target || 'all' }}
    secrets: inherit

  publish-existing-pi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'publish-pi'
    uses: ./.github/workflows/publish-pi-image.yml
    with:
      source_run: ${{ inputs.source_run }}
    secrets: inherit
  # =========================================================================
  # 1. Fully Supported (Raspberry Pi)
  # =========================================================================
  supported-images:
    name: supported-${{ matrix.target }}
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'supported'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - pi-bullseye
    steps:
      - uses: actions/checkout@v7
      - name: Prepare development image
        run: |
          echo "DT=${IMAGE_RELEASE}-$(date -u +'%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_ENV"
          touch additionalFiles/dev-build
      - name: Free runner disk space
        run: |
          # The Android SDK and language toolchains occupy most of a hosted
          # runner's disk. Radxa images need enough temporary space for both
          # the downloaded base image and the expanded working image.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get purge -y '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' \
            azure-cli google-chrome-stable firefox powershell \
            microsoft-edge-stable mono-devel || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"
      - name: Install host tools and current e2fsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl git qemu-user-static binfmt-support mtools
          bash ./scripts/install_current_e2fsprogs.sh
          sudo ./install_dep.sh
      - name: Build image
        run: sudo ./build.sh "${{ matrix.target }}" false false true
      - name: Normalize image
        run: |
          set -euo pipefail
          mapfile -t images < <(find deploy -maxdepth 1 -type f -name '*.img')
          test "${#images[@]}" -eq 1
          sudo mv "${images[0]}" "deploy/openhd-image-${{ matrix.target }}-${DT}.img"
          bash scripts/validate_pi_settings_manifest.sh "deploy/openhd-image-${{ matrix.target }}-${DT}.img"
      - uses: actions/upload-artifact@v7
        with:
          name: openhd-image-${{ matrix.target }}-${{ env.DT }}
          path: deploy/*.img
          if-no-files-found: error
      - name: Stage image on FleetControl
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'supported'
        env:
          FLEETCONTROL_DEV_IMAGE_TOKEN: ${{ secrets.FLEETCONTROL_DEV_IMAGE_TOKEN }}
        run: bash scripts/publish_dev_image.sh "${{ matrix.target }}" "deploy/openhd-image-${{ matrix.target }}-${DT}.img"

  # =========================================================================
  # 2. OpenHD Hardware (X21, X20)
  # =========================================================================
  openhd-hardware-x21:
    name: openhd-hardware-x21
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'openhd-hardware' || inputs.target == 'x21-update'
    runs-on: ubuntu-24.04
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Set X21B release timestamp
        run: echo "DT=${IMAGE_RELEASE}-$(date -u +'%Y-%m-%d-%H-%M-%S')" >>"${GITHUB_ENV}"

      - name: Fetch the coherent production X21B base
        run: python3 scripts/fetch_x21_base.py --output x21-base --env-file "${GITHUB_ENV}"

      - name: Resolve a compatible X21B component pair
        run: |
          python3 scripts/resolve_matching_components.py \
            --platform x21b \
            --openhd-prefix openhd-x21b- \
            --sysutils-prefix openhd-sys-utils-x21b- \
            --sysutils-provisioning-version 1 \
            --sdk-sha256 "${X21_BASE_SDK_SHA256}" \
            >>"${GITHUB_ENV}"

      - name: Download X21B component packages from Cloudsmith
        run: |
          set -euo pipefail
          mkdir -p x21-components
          for name in "${OPENHD_COMPONENT_NAME}" "${SYSUTILS_COMPONENT_NAME}"; do
            curl --fail --location --retry 5 --retry-delay 3 \
              "${X21_COMPONENT_BASE_URL}/${name}" -o "x21-components/${name}"
            curl --fail --location --retry 5 --retry-delay 3 \
              "${X21_COMPONENT_BASE_URL}/${name}.sha256" -o "x21-components/${name}.sha256"
          done
          cd x21-components
          sha256sum -c "${OPENHD_COMPONENT_NAME}.sha256"
          sha256sum -c "${SYSUTILS_COMPONENT_NAME}.sha256"

      - name: Stage the verified X21B base and filesystem seed
        run: |
          set -euo pipefail
          test "${COMPONENT_SDK_SHA256}" = "${X21_BASE_SDK_SHA256}"
          test "${COMPONENT_BUILDROOT_COMMIT}" = "${X21_BASE_BUILDROOT_COMMIT}"
          mkdir -p x21-ohd-seed x21-output
          tar -xzf x21-base/ohd-seed.tar.gz -C x21-ohd-seed
          cp x21-base/firmware.zip x21-output/firmware-base.zip
          cp x21-base/base-manifest.json x21-output/base-manifest.json

      - name: Install SWUpdate image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio fakeroot file mtd-utils unzip zip

      - name: Check production packaging
        run: python3 -m unittest discover -s scripts/tests -p 'test_x21_production.py' -v

      - name: Assemble flashable X21B update
        run: |
          fakeroot -- ./scripts/build_x21_update.sh \
            "${GITHUB_WORKSPACE}/x21-ohd-seed" \
            "${GITHUB_WORKSPACE}/x21-components/${OPENHD_COMPONENT_NAME}" \
            "${GITHUB_WORKSPACE}/x21-components/${SYSUTILS_COMPONENT_NAME}" \
            "${GITHUB_WORKSPACE}/x21-output"

      - name: Timestamp the latest X21B update
        run: |
          set -euo pipefail
          mv x21-output/OpenHD-X21B-latest.ohd \
            "x21-output/OpenHD-X21B-applications-${DT}.ohd"
          cp x21-output/OpenHD-X21B-latest.ohd.manifest.json x21-output/applications-manifest.json

      - name: Assemble the complete A/B base and application update
        run: |
          python3 scripts/build_x21_full_update.py \
            x21-output/firmware-base.zip \
            "x21-output/OpenHD-X21B-applications-${DT}.ohd" \
            "x21-output/OpenHD-X21B-full-${DT}.ohd_base"

      - name: Put the updated OHD partition into the full X21B firmware
        run: |
          set -euo pipefail
          pack_tools="${RUNNER_TEMP}/x21-pack-tools"
          mkdir -p "${pack_tools}"
          pack_url="https://raw.githubusercontent.com/OpenHD/luckfox-pico-sdk/00aee4108ab9ee72f21d0b1ab83fb0afd5cac134/tools/linux/Linux_Pack_Firmware"
          curl -fsSL --retry 5 "${pack_url}/afptool" -o "${pack_tools}/afptool"
          curl -fsSL --retry 5 "${pack_url}/rkImageMaker" -o "${pack_tools}/rkImageMaker"
          (cd "${pack_tools}" && sha256sum -c <<'EOF'
          c5ff2f9ac587bf47c808c1a0c1e2f78a6d9c582f7a6fb9e8be5beb7b17b634fd  afptool
          a26367480183188185b2415aa14cc8c8e748f3f9c1592602227e3c97536b8866  rkImageMaker
          EOF
          )
          chmod +x "${pack_tools}/afptool" "${pack_tools}/rkImageMaker"
          bash ./scripts/repack_x21_firmware.sh \
            "${GITHUB_WORKSPACE}/x21-output/firmware-base.zip" \
            "${GITHUB_WORKSPACE}/x21-output/OpenHD-X21B-applications-${DT}.ohd" \
            "${GITHUB_WORKSPACE}/x21-output/firmware-x21b-${DT}.zip" "${pack_tools}"
          zip -q -j "x21-output/firmware-x21b-${DT}.zip" \
            x21-output/base-manifest.json x21-output/applications-manifest.json
          rm x21-output/firmware-base.zip

      - name: Upload X21B firmware for direct USB flashing
        uses: actions/upload-artifact@v7
        with:
          path: x21-output/firmware-x21b-${{ env.DT }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload X21B applications update
        uses: actions/upload-artifact@v7
        with:
          name: OpenHD-X21B-applications-${{ env.DT }}
          path: x21-output/OpenHD-X21B-applications-${{ env.DT }}.ohd
          if-no-files-found: error
          retention-days: 30

      - name: Upload X21B full system update
        uses: actions/upload-artifact@v7
        with:
          name: OpenHD-X21B-full-${{ env.DT }}
          path: |
            x21-output/OpenHD-X21B-full-${{ env.DT }}.ohd_base
            x21-output/OpenHD-X21B-full-${{ env.DT }}.ohd_base.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Stage X21B firmware and update on FleetControl
        if: github.ref == 'refs/heads/snapshots'
        env:
          FLEETCONTROL_DEV_IMAGE_TOKEN: ${{ secrets.FLEETCONTROL_DEV_IMAGE_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/publish_dev_image.sh x21b "x21-output/firmware-x21b-${DT}.zip" none
          bash scripts/publish_dev_image.sh x21b-update "x21-output/OpenHD-X21B-full-${DT}.ohd_base"

      - name: Promote completed X21B firmware and update
        if: github.ref == 'refs/heads/snapshots'
        env:
          FLEETCONTROL_DEV_IMAGE_TOKEN: ${{ secrets.FLEETCONTROL_DEV_IMAGE_TOKEN }}
        run: |
          set -euo pipefail
          : "${FLEETCONTROL_DEV_IMAGE_TOKEN:?FLEETCONTROL_DEV_IMAGE_TOKEN is required}"
          curl --fail-with-body --retry 5 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${FLEETCONTROL_DEV_IMAGE_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"platforms":["x21b","x21b-update"]}' \
            "https://openhd.tech/api/internal/dev-images/${GITHUB_RUN_ID}/promote"

      - name: Install Cloudsmith CLI
        run: pipx install cloudsmith-cli

      - name: Publish X21B update files to Cloudsmith
        run: |
          set -euo pipefail
          : "${CLOUDSMITH_API_KEY:?CLOUDSMITH_API_KEY secret is required to publish X21B files}"
          ohd_package="x21-output/OpenHD-X21B-full-${DT}.ohd_base"
          firmware_package="x21-output/firmware-x21b-${DT}.zip"
          test -s "${ohd_package}"
          test -s "${firmware_package}"
          cloudsmith push raw --republish \
            --name openhd-x21b-full \
            --version "${DT}" \
            openhd/x21 "${ohd_package}"
          cloudsmith push raw --republish \
            --name firmware \
            --version "${DT}" \
            openhd/x21 "${firmware_package}"

  openhd-hardware-x20:
    name: openhd-hardware-x20
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'openhd-hardware'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Prepare and install dependencies
        run: |
          echo "DT=${IMAGE_RELEASE}-$(date -u +'%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_ENV"
          touch additionalFiles/dev-build
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          sudo ./install_dep.sh
      - name: Build X20 image
        run: sudo ./build.sh x20 false false false
      - name: Normalize image
        run: |
          set -euo pipefail
          mapfile -t images < <(find deploy -maxdepth 1 -type f -name '*.img')
          test "${#images[@]}" -eq 1
          sudo mv "${images[0]}" "deploy/openhd-image-x20-${DT}.img"
      - uses: actions/upload-artifact@v7
        with:
          name: openhd-image-x20-${{ env.DT }}
          path: deploy/*.img
          if-no-files-found: error
  openhd-hardware-orqa:
    name: openhd-hardware-orqa
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'openhd-hardware' || inputs.target == 'orqa'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
      ORQA_SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare ORQA image build
        run: |
          set -euo pipefail
          echo "DT=${IMAGE_RELEASE}-$(date -u +'%Y-%m-%d-%H-%M-%S')" >>"${GITHUB_ENV}"
          source images/orqa
          {
            echo "ORQA_BASE_IMAGE=${BASE_IMAGE}"
            echo "ORQA_BASE_URL=${BASE_IMAGE_URL}/${BASE_IMAGE}"
            echo "ORQA_BASE_SHA256=${BASE_IMAGE_SHA256}"
            echo "ORQA_OUTPUT_IMAGE=${OUTPUT_IMAGE}"
          } >>"${GITHUB_ENV}"

      - name: Download and verify the ORQA base firmware
        run: |
          set -euo pipefail
          mkdir -p orqa-input
          curl --fail --location --retry 5 --retry-delay 3 \
            "${ORQA_BASE_URL}" -o "orqa-input/${ORQA_BASE_IMAGE}"
          echo "${ORQA_BASE_SHA256}  orqa-input/${ORQA_BASE_IMAGE}" | sha256sum -c -

      - name: Download the latest successful ORQA OpenHD payload
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?OPENHD_SUBMODULE_TOKEN secret is required to download the ORQA payload}"

          on_release_line() {
            local relation
            relation="$(gh api "repos/OpenHD/OpenHD/compare/$1...snapshots" --jq .status)" || return 1
            [[ "$relation" == ahead || "$relation" == identical ]]
          }

          if [[ -n "${ORQA_SOURCE_RUN}" ]]; then
            [[ "${ORQA_SOURCE_RUN}" =~ ^[0-9]+$ ]]
            run_id="${ORQA_SOURCE_RUN}"
            head_sha="$(gh api "repos/OpenHD/OpenHD/actions/runs/${run_id}" --jq .head_sha)"
            on_release_line "$head_sha"
          else
            # The artifact is tied to the ORQA job, even if an unrelated job failed.
            # Check ancestry because dev-release previously pointed at another line.
            candidates="$(gh api 'repos/OpenHD/OpenHD/actions/artifacts?name=openhd-orqa&per_page=30' \
              --jq '.artifacts[] | select(.expired == false) |
                select(.workflow_run.head_branch == "snapshots" or .workflow_run.head_branch == "dev-release" or .workflow_run.head_branch == "openhd-3.0") |
                [.workflow_run.id, .workflow_run.head_sha] | @tsv')"
            run_id=
            while IFS=$'\t' read -r candidate sha; do
              if [[ -n "$sha" ]] && on_release_line "$sha"; then
                run_id="$candidate"
                head_sha="$sha"
                break
              fi
            done <<< "$candidates"
            : "${run_id:?No unexpired ORQA artifact from the OpenHD snapshots history}"
          fi
          gh api "repos/OpenHD/OpenHD/actions/runs/${run_id}/jobs?per_page=100" \
            | jq -e 'any(.jobs[]; .name == "build-orqa" and .conclusion == "success")'
          echo "Using OpenHD final_ci run ${run_id} at ${head_sha}"

          mkdir -p orqa-input/openhd
          gh run download "${run_id}" \
            --repo OpenHD/OpenHD \
            --name openhd-orqa \
            --dir orqa-input/openhd
          test -s orqa-input/openhd/openhd-orqa-deploy.tar.gz

          curl --fail --location --retry 5 --retry-delay 3 \
            "https://raw.githubusercontent.com/OpenHD/OpenHD-SysUtils/snapshots/misc/wifi_cards.json" \
            -o orqa-input/wifi_cards.json

      - name: Install OpenHD into the ORQA flash bundle
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends e2fsprogs dosfstools mtools unzip zip
          bash scripts/install_current_e2fsprogs.sh
          mkdir -p deploy
          sudo bash scripts/build_orqa_image.sh \
            "orqa-input/${ORQA_BASE_IMAGE}" \
            orqa-input/openhd/openhd-orqa-deploy.tar.gz \
            orqa-input/wifi_cards.json \
            "deploy/${ORQA_OUTPUT_IMAGE}-${DT}.zip"

      - name: Verify the ORQA flash bundle
        run: |
          set -euo pipefail
          archive="deploy/${ORQA_OUTPUT_IMAGE}-${DT}.zip"
          test -s "${archive}"
          mapfile -t files < <(unzip -Z1 "${archive}" | sort)
          expected=(
            USB-MASS-STORAGE.txt
            bootloader.img
            config.img
            data.img
            kernel.img
            openhd-storage.json
            partition-table.img
            recordings.img
            recovery.img
            rootfs.img
            uuu-mass-storage.auto
            uuu.auto
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${files[@]}")
          sha256sum "${archive}" >"${archive}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: openhd-image-orqa-${{ env.DT }}
          path: |
            deploy/${{ env.ORQA_OUTPUT_IMAGE }}-${{ env.DT }}.zip
            deploy/${{ env.ORQA_OUTPUT_IMAGE }}-${{ env.DT }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
  # =========================================================================
  # 3. Full (running QOpenHD)
  # =========================================================================
  full-images:
    name: full-${{ matrix.target }}
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'full' || inputs.target == 'radxa-zero3w' || inputs.target == 'ochin-v1' || inputs.target == 'ochin-v2'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON((inputs.target == 'radxa-zero3w' || inputs.target == 'ochin-v1' || inputs.target == 'ochin-v2') && format('["{0}"]', inputs.target) || '["rock5a","rock5b","radxa-zero3w","radxa-rock3a"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare development image
        run: |
          echo "DT=${IMAGE_RELEASE}-$(date -u +'%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_ENV"
          touch additionalFiles/dev-build
      - name: Free runner disk space
        run: |
          # The Android SDK and language toolchains occupy most of a hosted
          # runner's disk. Radxa images need enough temporary space for both
          # the downloaded base image and the expanded working image.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get purge -y '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' \
            azure-cli google-chrome-stable firefox powershell \
            microsoft-edge-stable mono-devel || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"
      - name: Install host tools and current e2fsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl git qemu-user-static binfmt-support
          bash ./scripts/install_current_e2fsprogs.sh
          sudo ./install_dep.sh
      - name: Build image
        run: sudo ./build.sh "${{ matrix.target }}" false false true
      - name: Normalize image
        run: |
          set -euo pipefail
          mapfile -t images < <(find deploy -maxdepth 1 -type f -name '*.img')
          test "${#images[@]}" -eq 1
          sudo mv "${images[0]}" "deploy/openhd-image-${{ matrix.target }}-${DT}.img"
      - uses: actions/upload-artifact@v7
        with:
          name: openhd-image-${{ matrix.target }}-${{ env.DT }}
          path: deploy/*.img
          if-no-files-found: error
      - name: Publish Zero 3W to the ImageWriter development catalog
        if: matrix.target == 'radxa-zero3w'
        env:
          FLEETCONTROL_DEV_IMAGE_TOKEN: ${{ secrets.FLEETCONTROL_DEV_IMAGE_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/publish_dev_image.sh radxa-zero3w "deploy/openhd-image-radxa-zero3w-${DT}.img"
          curl --fail-with-body --retry 5 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${FLEETCONTROL_DEV_IMAGE_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"platforms":["radxa-zero3w"]}' \
            "https://openhd.tech/api/internal/dev-images/${GITHUB_RUN_ID}/promote"
  # =========================================================================
  # 4. Experimental Pi 5
  # =========================================================================
  experimental-pi5-image:
    name: experimental-pi5-trixie-qt6
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'experimental' || inputs.target == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: OpenHD/QOpenHD
          ref: snapshots
          submodules: recursive
          path: components/QOpenHD
      - uses: actions/checkout@v7
        with:
          repository: OpenHD/OpenHD-SysUtils
          ref: snapshots
          path: components/OpenHD-SysUtils
      - uses: actions/checkout@v7
        with:
          repository: OpenHD/OpenHD
          ref: snapshots
          submodules: true
          token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
          path: components/OpenHD
      - name: Fetch pinned backend inputs
        working-directory: components/OpenHD
        run: |
          git -c submodule.OpenHD/ohd_interface/lib/devourer.update=checkout \
              submodule update --init -- OpenHD/ohd_interface/lib/devourer
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"
      - name: Prepare and install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 git qemu-user-static binfmt-support curl rsync xz-utils parted dosfstools e2fsprogs
      - name: Build Raspberry Pi 5 image
        run: |
          sudo env PI5_OPENHD_SOURCE="$GITHUB_WORKSPACE/components/OpenHD" BUILD_JOBS=2 \
            bash scripts/build-pi5-ground.sh "$GITHUB_WORKSPACE/components/QOpenHD" \
              "$GITHUB_WORKSPACE/components/OpenHD-SysUtils" "$GITHUB_WORKSPACE/pi5-build"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: OpenHD-RPi5-Ground-Trixie-Qt6
          path: |
            pi5-build/OpenHD-RPi5-Ground-Trixie.img.xz
            pi5-build/OpenHD-RPi5-Ground-Trixie.img.xz.sha256
            pi5-build/image-manifest.txt
            pi5-build/*validation.txt
            pi5-build/dpkg-audit.txt
          if-no-files-found: error

  publish-pi-image:
    name: publish-pi-image
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'supported'
    needs:
      - supported-images
    runs-on: ubuntu-24.04
    steps:
      - name: Promote completed Pi image
        env:
          FLEETCONTROL_DEV_IMAGE_TOKEN: ${{ secrets.FLEETCONTROL_DEV_IMAGE_TOKEN }}
        run: |
          set -euo pipefail
          : "${FLEETCONTROL_DEV_IMAGE_TOKEN:?FLEETCONTROL_DEV_IMAGE_TOKEN is required}"
          curl --fail-with-body --retry 5 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${FLEETCONTROL_DEV_IMAGE_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"platforms":["pi-bullseye"]}' \
            "https://openhd.tech/api/internal/dev-images/${GITHUB_RUN_ID}/promote"










