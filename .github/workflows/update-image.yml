name: New_Image_Workflow

on:
  workflow_dispatch:
    inputs:
      target:
        description: Image set to build
        required: true
        type: choice
        default: all
        options:
          - all
          - supported
          - openhd-hardware
          - full
          - lite
          - experimental
          - embedded-sdk
          - x21-update
          - luckfox-update
  push:
    branches:
      - dev-release

concurrency:
  group: final-image-ci-${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BRANCH: dev-release
  X21_COMPONENT_BASE_URL: https://dl.cloudsmith.io/public/openhd/dev-release/raw/files
  X21_SOURCE_RUN_ID: "34479273960"
  LUCKFOX_COMPONENT_BASE_URL: https://dl.cloudsmith.io/public/openhd/dev-release/raw/files
  LUCKFOX_SOURCE_RUN_ID: "0"

jobs:
  # =========================================================================
  # 1. Fully Supported (Raspberry Pi)
  # =========================================================================
  supported-images:
    name: supported-${{ matrix.target }}
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'supported'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - pi-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Prepare development image
        run: |
          echo "DT=$(date -u +'%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_ENV"
          touch additionalFiles/dev-build
      - name: Free runner disk space
        run: |
          # The Android SDK and language toolchains occupy most of a hosted
          # runner's disk. Radxa images need enough temporary space for both
          # the downloaded base image and the expanded working image.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get purge -y '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' \
            azure-cli google-chrome-stable firefox powershell \
            microsoft-edge-stable mono-devel || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"
      - name: Install host tools and current e2fsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl git qemu-user-static binfmt-support
          bash ./scripts/install_current_e2fsprogs.sh
          sudo ./install_dep.sh
      - name: Build image
        run: sudo ./build.sh "${{ matrix.target }}" false false true
      - name: Normalize image
        run: |
          set -euo pipefail
          mapfile -t images < <(find deploy -maxdepth 1 -type f -name '*.img')
          test "${#images[@]}" -eq 1
          sudo mv "${images[0]}" "deploy/openhd-image-${{ matrix.target }}-${DT}.img"
      - uses: actions/upload-artifact@v4
        with:
          name: openhd-image-${{ matrix.target }}-${{ env.DT }}
          path: deploy/*.img
          if-no-files-found: error

  # =========================================================================
  # 2. OpenHD Hardware (X21, X20)
  # =========================================================================
  openhd-hardware-x21:
    name: openhd-hardware-x21
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'openhd-hardware' || inputs.target == 'x21-update'
    runs-on: ubuntu-24.04
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set X21B release timestamp
        run: echo "DT=$(date -u +'%Y-%m-%d-%H-%M-%S')" >>"${GITHUB_ENV}"

      - name: Download X21B component packages from Cloudsmith
        run: |
          set -euo pipefail
          mkdir -p x21-components
          for name in openhd-x21b-latest.tar.gz openhd-sys-utils-x21b-latest.tar.gz; do
            curl --fail --location --retry 5 --retry-delay 3 \
              "${X21_COMPONENT_BASE_URL}/${name}" -o "x21-components/${name}"
            curl --fail --location --retry 5 --retry-delay 3 \
              "${X21_COMPONENT_BASE_URL}/${name}.sha256" -o "x21-components/${name}.sha256"
          done
          cd x21-components
          sha256sum -c openhd-x21b-latest.tar.gz.sha256
          sha256sum -c openhd-sys-utils-x21b-latest.tar.gz.sha256

      - name: Download, verify and extract the stable X21B filesystem seed
        run: |
          set -euo pipefail
          mkdir -p x21-ohd-seed-artifact
          for name in openhd-x21b-ohd-root.tar.gz openhd-x21b-ohd-root.tar.gz.sha256 openhd-x21b-ohd-root.tar.gz.manifest.json; do
            curl --fail --location --retry 5 --retry-delay 3 \
              "${X21_COMPONENT_BASE_URL}/${name}" -o "x21-ohd-seed-artifact/${name}"
          done
          mkdir -p x21-ohd-seed
          (
            cd x21-ohd-seed-artifact
            sha256sum -c openhd-x21b-ohd-root.tar.gz.sha256
          )
          echo "X21_OHD_SEED_SHA256=$(sha256sum x21-ohd-seed-artifact/openhd-x21b-ohd-root.tar.gz | awk '{print $1}')" >>"${GITHUB_ENV}"
          tar -xzf x21-ohd-seed-artifact/openhd-x21b-ohd-root.tar.gz -C x21-ohd-seed

      - name: Download and verify the stable X21B full firmware
        id: x21-firmware-cache
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p x21-firmware-cache
          for name in firmware.zip firmware.zip.sha256; do
            curl --fail --location --retry 5 --retry-delay 3 \
              "${X21_COMPONENT_BASE_URL}/${name}" -o "x21-firmware-cache/${name}"
          done
          cd x21-firmware-cache
          sha256sum -c firmware.zip.sha256

      # The publisher and image workflows can start together after this cache
      # definition changes. Fall back to the pinned source run for that first
      # build; subsequent builds use the durable Cloudsmith copy above.
      - name: Download X21B full firmware from the source run
        if: steps.x21-firmware-cache.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          repository: OpenHD/OpenHD-X21B
          run-id: ${{ env.X21_SOURCE_RUN_ID }}
          name: ota-img
          github-token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
          path: x21-firmware-input

      - name: Stage the base X21B full firmware
        run: |
          set -euo pipefail
          if [[ "${{ steps.x21-firmware-cache.outcome }}" == "success" ]]; then
            firmware_source=x21-firmware-cache/firmware.zip
          else
            firmware_source=x21-firmware-input/firmware.zip
          fi
          test -s "${firmware_source}"
          mkdir -p x21-output
          cp "${firmware_source}" x21-output/firmware-base.zip

      - name: Install SWUpdate image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio fakeroot file mtd-utils unzip zip

      - name: Assemble flashable X21B update
        run: |
          fakeroot -- ./scripts/build_x21_update.sh \
            "${GITHUB_WORKSPACE}/x21-ohd-seed" \
            "${GITHUB_WORKSPACE}/x21-components/openhd-x21b-latest.tar.gz" \
            "${GITHUB_WORKSPACE}/x21-components/openhd-sys-utils-x21b-latest.tar.gz" \
            "${GITHUB_WORKSPACE}/x21-output"

      - name: Timestamp the latest X21B update
        run: |
          set -euo pipefail
          mv x21-output/OpenHD-X21B-latest.ohd \
            "x21-output/OpenHD-X21B-full-${DT}.ohd"

      - name: Put the updated OHD partition into the full X21B firmware
        run: |
          set -euo pipefail
          bash ./scripts/repack_x21_firmware.sh \
            "${GITHUB_WORKSPACE}/x21-output/firmware-base.zip" \
            "${GITHUB_WORKSPACE}/x21-output/OpenHD-X21B-full-${DT}.ohd" \
            "${GITHUB_WORKSPACE}/x21-output/firmware-${DT}.zip"
          rm x21-output/firmware-base.zip

      - name: Upload flashable X21B update
        uses: actions/upload-artifact@v4
        with:
          name: openhd-image-x21b-${{ env.DT }}
          path: |
            x21-output/OpenHD-X21B-full-${{ env.DT }}.ohd
            x21-output/firmware-${{ env.DT }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Install Cloudsmith CLI
        run: pipx install cloudsmith-cli

      - name: Publish X21B update files to Cloudsmith
        run: |
          set -euo pipefail
          : "${CLOUDSMITH_API_KEY:?CLOUDSMITH_API_KEY secret is required to publish X21B files}"
          ohd_package="x21-output/OpenHD-X21B-full-${DT}.ohd"
          firmware_package="x21-output/firmware-${DT}.zip"
          test -s "${ohd_package}"
          test -s "${firmware_package}"
          cloudsmith push raw --republish \
            --name openhd-x21b-full \
            --version "${DT}" \
            openhd/x21 "${ohd_package}"
          cloudsmith push raw --republish \
            --name firmware \
            --version "${DT}" \
            openhd/x21 "${firmware_package}"

  openhd-hardware-luckfox:
    name: openhd-hardware-luckfox
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'openhd-hardware' || inputs.target == 'luckfox-update'
    runs-on: ubuntu-24.04
