name: final_image_ci

on:
  workflow_dispatch:
  push:
    branches:
      - dev-release

concurrency:
  group: final-image-ci
  cancel-in-progress: true

permissions:
  contents: read

env:
  BRANCH: dev-release

jobs:
  full-images:
    name: full-${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - rock5a
          - rock5b
          - radxa-zero3w
          - pi-bullseye
          - radxa-rock3a
          - x86-minimal
          - x86-noble
    steps:
      - uses: actions/checkout@v4
      - name: Prepare development image
        run: |
          echo "DT=$(date -u +'%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_ENV"
          touch additionalFiles/dev-build
      - name: Free runner disk space
        run: |
          # The Android SDK and language toolchains occupy most of a hosted
          # runner's disk.  Radxa images need enough temporary space for both
          # the downloaded base image and the expanded working image.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get purge -y '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' \
            azure-cli google-chrome-stable firefox powershell \
            microsoft-edge-stable mono-devel || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"
      - name: Install host tools and current e2fsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl git qemu-user-static binfmt-support
          bash ./scripts/install_current_e2fsprogs.sh
          sudo ./install_dep.sh
      - name: Build image
        run: sudo ./build.sh "${{ matrix.target }}" false false true
      - name: Normalize image
        run: |
          set -euo pipefail
          mapfile -t images < <(find deploy -maxdepth 1 -type f -name '*.img')
          test "${#images[@]}" -eq 1
          sudo mv "${images[0]}" "deploy/openhd-image-${{ matrix.target }}-${DT}.img"
      - uses: actions/upload-artifact@v4
        with:
          name: openhd-image-${{ matrix.target }}-${{ env.DT }}
          path: deploy/*.img
          if-no-files-found: error

  x20-image:
    name: full-x20
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and install dependencies
        run: |
          echo "DT=$(date -u +'%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_ENV"
          touch additionalFiles/dev-build
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          sudo ./install_dep.sh
      - name: Build X20 image
        run: sudo ./build.sh x20 false false false
      - name: Normalize image
        run: |
          set -euo pipefail
          mapfile -t images < <(find deploy -maxdepth 1 -type f -name '*.img')
          test "${#images[@]}" -eq 1
          sudo mv "${images[0]}" "deploy/openhd-image-x20-${DT}.img"
      - uses: actions/upload-artifact@v4
        with:
          name: openhd-image-x20-${{ env.DT }}
          path: deploy/*.img
          if-no-files-found: error

  lite-images:
    name: lite-${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - radxa-cubie-lite
          - radxa-zero3w-lite
          - radxa-cm5-lite
          - orangepi-zero3w-lite
          - rock5a-lite
          - rock5b-lite
    steps:
      - uses: actions/checkout@v4
      - name: Prepare development image
        run: |
          echo "DT=$(date -u +'%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_ENV"
          touch additionalFiles/dev-build
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get purge -y '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' \
            azure-cli google-chrome-stable firefox powershell \
            microsoft-edge-stable mono-devel || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"
      - name: Install host tools and current e2fsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl git qemu-user-static binfmt-support rclone
          bash ./scripts/install_current_e2fsprogs.sh
          sudo ./install_dep.sh
      - name: Build Lite image
        env:
          OPENHD_RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
        run: sudo -E ./build.sh "${{ matrix.target }}" false false true
      - name: Normalize image
        run: |
          set -euo pipefail
          mapfile -t images < <(find deploy -maxdepth 1 -type f -name '*.img')
          test "${#images[@]}" -eq 1
          sudo mv "${images[0]}" "deploy/openhd-lite-image-${{ matrix.target }}-${DT}.img"
      - uses: actions/upload-artifact@v4
        with:
          name: openhd-lite-image-${{ matrix.target }}-${{ env.DT }}
          path: deploy/*.img
          if-no-files-found: error

  pi5-image:
    name: full-pi5-bookworm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"
      - name: Prepare and install dependencies
        run: |
          touch additionalFiles/dev-build
          printf '%s\n' 'OpenHD Raspberry Pi 5 Bookworm image' > additionalFiles/issue-new.txt
          sudo ./install_dep.sh
      - name: Build Raspberry Pi 5 image
        run: sudo ./build.sh pi5-bookworm false small false
      - name: Normalize image
        run: |
          set -euo pipefail
          mapfile -t images < <(find deploy -maxdepth 1 -type f -name '*.img')
          test "${#images[@]}" -eq 1
          sudo mv "${images[0]}" deploy/OpenHD-RPi5-Bookworm-arm64.img
      - uses: actions/upload-artifact@v4
        with:
          name: OpenHD-RPi5-Bookworm-arm64
          path: deploy/OpenHD-RPi5-Bookworm-arm64.img
          if-no-files-found: error
