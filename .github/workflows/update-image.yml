name: final_image_ci

on:
  workflow_dispatch:
    inputs:
      target:
        description: Image set to build
        required: true
        type: choice
        default: all
        options:
          - all
          - x21-update
  push:
    branches:
      - dev-release

concurrency:
  group: final-image-ci-${{ github.event_name == 'workflow_dispatch' && inputs.target == 'x21-update' && 'x21-update' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BRANCH: dev-release
  X21_SDK_REPOSITORY: OpenHD/OpenHD-X21B
  X21_OHD_SEED_RUN_ID: "34479273960"
  X21_OHD_SEED_ARTIFACT: openhd-x21b-ohd-root
  X21_COMPONENT_BASE_URL: https://dl.cloudsmith.io/public/openhd/dev-release/raw/files

jobs:
  x21-update:
    name: fast-x21-update
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'x21-update'
    runs-on: ubuntu-24.04
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Download X21B component packages from Cloudsmith
        run: |
          set -euo pipefail
          mkdir -p x21-components
          for name in openhd-x21b-latest.tar.gz openhd-sys-utils-x21b-latest.tar.gz; do
            curl --fail --location --retry 5 --retry-delay 3 \
              "${X21_COMPONENT_BASE_URL}/${name}" -o "x21-components/${name}"
            curl --fail --location --retry 5 --retry-delay 3 \
              "${X21_COMPONENT_BASE_URL}/${name}.sha256" -o "x21-components/${name}.sha256"
          done
          cd x21-components
          sha256sum -c openhd-x21b-latest.tar.gz.sha256
          sha256sum -c openhd-sys-utils-x21b-latest.tar.gz.sha256

      - name: Download pinned X21B OHD filesystem seed
        uses: actions/download-artifact@v4
        with:
          repository: ${{ env.X21_SDK_REPOSITORY }}
          run-id: ${{ env.X21_OHD_SEED_RUN_ID }}
          name: ${{ env.X21_OHD_SEED_ARTIFACT }}
          github-token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
          path: x21-ohd-seed-artifact

      - name: Verify and extract filesystem seed
        run: |
          set -euo pipefail
          mkdir -p x21-ohd-seed
          (
            cd x21-ohd-seed-artifact
            sha256sum -c openhd-x21b-ohd-root.tar.gz.sha256
          )
          echo "X21_OHD_SEED_SHA256=$(sha256sum x21-ohd-seed-artifact/openhd-x21b-ohd-root.tar.gz | awk '{print $1}')" >>"${GITHUB_ENV}"
          tar -xzf x21-ohd-seed-artifact/openhd-x21b-ohd-root.tar.gz -C x21-ohd-seed

      - name: Install SWUpdate image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio fakeroot file mtd-utils

      - name: Assemble flashable X21B update
        run: |
          fakeroot -- ./scripts/build_x21_update.sh \
            "${GITHUB_WORKSPACE}/x21-ohd-seed" \
            "${GITHUB_WORKSPACE}/x21-components/openhd-x21b-latest.tar.gz" \
            "${GITHUB_WORKSPACE}/x21-components/openhd-sys-utils-x21b-latest.tar.gz" \
            "${GITHUB_WORKSPACE}/x21-output"

      - name: Upload flashable X21B update
        uses: actions/upload-artifact@v4
        with:
          name: openhd-image-x21b
          path: x21-output/
          if-no-files-found: error
          retention-days: 30

      - name: Install Cloudsmith CLI
        if: env.CLOUDSMITH_API_KEY != ''
        run: pipx install cloudsmith-cli

      - name: Publish X21B update files to Cloudsmith
        if: env.CLOUDSMITH_API_KEY != ''
        run: |
          set -euo pipefail
          for package in x21-output/*; do
            cloudsmith push raw --republish openhd/dev-release "${package}"
          done

  full-images:
    name: full-${{ matrix.target }}
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - rock5a
          - rock5b
          - radxa-zero3w
          - pi-bullseye
          - radxa-rock3a
          - x86-minimal
          - x86-noble
    steps:
      - uses: actions/checkout@v4
      - name: Prepare development image
        run: |
          echo "DT=$(date -u +'%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_ENV"
          touch additionalFiles/dev-build
      - name: Free runner disk space
        run: |
          # The Android SDK and language toolchains occupy most of a hosted
          # runner's disk.  Radxa images need enough temporary space for both
          # the downloaded base image and the expanded working image.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get purge -y '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' \
            azure-cli google-chrome-stable firefox powershell \
            microsoft-edge-stable mono-devel || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"
      - name: Install host tools and current e2fsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl git qemu-user-static binfmt-support
          bash ./scripts/install_current_e2fsprogs.sh
          sudo ./install_dep.sh
      - name: Build image
        run: sudo ./build.sh "${{ matrix.target }}" false false true
      - name: Normalize image
        run: |
          set -euo pipefail
          mapfile -t images < <(find deploy -maxdepth 1 -type f -name '*.img')
          test "${#images[@]}" -eq 1
          sudo mv "${images[0]}" "deploy/openhd-image-${{ matrix.target }}-${DT}.img"
      - uses: actions/upload-artifact@v4
        with:
          name: openhd-image-${{ matrix.target }}-${{ env.DT }}
          path: deploy/*.img
          if-no-files-found: error

  x20-image:
    name: full-x20
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and install dependencies
        run: |
          echo "DT=$(date -u +'%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_ENV"
          touch additionalFiles/dev-build
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          sudo ./install_dep.sh
      - name: Build X20 image
        run: sudo ./build.sh x20 false false false
      - name: Normalize image
        run: |
          set -euo pipefail
          mapfile -t images < <(find deploy -maxdepth 1 -type f -name '*.img')
          test "${#images[@]}" -eq 1
          sudo mv "${images[0]}" "deploy/openhd-image-x20-${DT}.img"
      - uses: actions/upload-artifact@v4
        with:
          name: openhd-image-x20-${{ env.DT }}
          path: deploy/*.img
          if-no-files-found: error

  lite-images:
    name: lite-${{ matrix.target }}
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - radxa-cubie-lite
          - radxa-zero3w-lite
          - radxa-cm5-lite
          - orangepi-zero3w-lite
          - rock5a-lite
          - rock5b-lite
    steps:
      - uses: actions/checkout@v4
      - name: Prepare development image
        run: |
          echo "DT=$(date -u +'%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_ENV"
          touch additionalFiles/dev-build
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get purge -y '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' \
            azure-cli google-chrome-stable firefox powershell \
            microsoft-edge-stable mono-devel || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"
      - name: Install host tools and current e2fsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl git qemu-user-static binfmt-support rclone
          bash ./scripts/install_current_e2fsprogs.sh
          sudo ./install_dep.sh
      - name: Build Lite image
        env:
          OPENHD_RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
        run: sudo -E ./build.sh "${{ matrix.target }}" false false true
      - name: Normalize image
        run: |
          set -euo pipefail
          mapfile -t images < <(find deploy -maxdepth 1 -type f -name '*.img')
          test "${#images[@]}" -eq 1
          sudo mv "${images[0]}" "deploy/openhd-lite-image-${{ matrix.target }}-${DT}.img"
      - uses: actions/upload-artifact@v4
        with:
          name: openhd-lite-image-${{ matrix.target }}-${{ env.DT }}
          path: deploy/*.img
          if-no-files-found: error

  pi5-image:
    name: full-pi5-bookworm
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"
      - name: Prepare and install dependencies
        run: |
          touch additionalFiles/dev-build
          printf '%s\n' 'OpenHD Raspberry Pi 5 Bookworm image' > additionalFiles/issue-new.txt
          sudo ./install_dep.sh
      - name: Build Raspberry Pi 5 image
        run: sudo ./build.sh pi5-bookworm false small false
      - name: Normalize image
        run: |
          set -euo pipefail
          mapfile -t images < <(find deploy -maxdepth 1 -type f -name '*.img')
          test "${#images[@]}" -eq 1
          sudo mv "${images[0]}" deploy/OpenHD-RPi5-Bookworm-arm64.img
      - uses: actions/upload-artifact@v4
        with:
          name: OpenHD-RPi5-Bookworm-arm64
          path: deploy/OpenHD-RPi5-Bookworm-arm64.img
          if-no-files-found: error
