name: Cloudsmith cleanup

on:
  schedule:
    - cron: '33 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List matching packages without deleting them
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: cloudsmith-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean unused packages and keep newest packages in x21
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          CLOUDSMITH_OWNER: openhd
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        shell: bash
        run: |
          args=()
          if [[ "$DRY_RUN" != "true" ]]; then
            args+=(--delete)
          fi
          python -u scripts/cloudsmith_cleanup.py "${args[@]}"
